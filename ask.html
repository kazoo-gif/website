<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goobz Creates - Ask/Contact</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">

        <!-- ===== TOP BAR ===== -->
        <div class="top-bar">
            <div>
                ♡ Goobz Creates.exe
                <div class="nav-links">
                    <a href="index.html">Home</a>
                    <a href="posts.html">Posts</a>
                    <a href="projects.html">Projects</a>
                    <a href="ask.html" class="active">Ask/Contact</a>
                </div>
            </div>

            <!-- URL bar with search -->
            <form id="searchForm" class="selectable" onsubmit="return false;">
                <div class="url-controls">
                    <button type="button" class="url-control-btn" aria-label="Back">◀</button>
                    <button type="button" class="url-control-btn" aria-label="Forward">▶</button>
                    <button type="button" class="url-control-btn" aria-label="Reload">⟳</button>
                </div>
                <div class="url-search">
                    <span class="search-label">Search</span>
                    <span>:</span>
                    <input aria-label="Search posts" autocomplete="on" id="searchInput" name="search"
                           placeholder="Search posts..." type="search">
                </div>
                <button aria-label="Clear search" class="url-control-btn" id="clearSearchBtn" type="button">✕</button>
            </form>
        </div>
        <!-- ===== END TOP BAR ===== -->

        <!-- ===== MAIN CONTENT AREA WITH GRID ===== -->
        <div class="grid">

            <!-- ===== LEFT SIDEBAR ===== -->
            <aside class="sidebar">

                <!-- Profile card with cherry blossoms -->
                <div class="profile-card profile-card--mono selectable">
                    <div class="profile-avatar">
                        <img alt="Anime girl with pink cherry blossoms background, circular portrait"
                             src="https://storage.googleapis.com/a1aa/image/6d8b772e-8f34-4122-075b-7d3bf8f030a0.jpg">
                    </div>
                    <div class="profile-name">Honey It's You!</div>
                    <div class="preview-badge">
                        <div>Preview: 8 / 8</div>
                        <div>You are viewing Marmalade Suite, the 29th theme released</div>
                    </div>
                    <button class="profile-status-btn">online</button>
                </div>

                <!-- Clock -->
                <div id="clock" class="footer-clock" style="text-align: center; color: #fff;">00:00:00</div>

                <!-- Calendar -->
                <div class="calendar selectable">
                    <div class="calendar-header" id="calendarMonthYear">SEPTEMBER 2019</div>
                    <div class="calendar-weekdays">
                        <div>Su</div>
                        <div>Mo</div>
                        <div>Tu</div>
                        <div>We</div>
                        <div>Th</div>
                        <div>Fr</div>
                        <div>Sa</div>
                    </div>
                    <div class="calendar-grid" id="calendarDays">
                        <!-- Days will be generated by JS -->
                    </div>
                </div>

            </aside>
            <!-- ===== END LEFT SIDEBAR ===== -->

            <!-- ===== MIDDLE / MAIN CONTENT ===== -->
            <main class="main-content" id="mainContent">

                <!-- Recent posts widget -->
                <div id="recentPosts" class="post-list"></div>

                <!-- Stats widget -->
                <div class="stats-card">
                    <div>Posts: <span id="postCount">0</span></div>
                    <div>Projects: <span id="projectCount">2</span></div>
                </div>

                <!-- Status / login state -->
                <div id="statusText" class="status-line">Visitor Mode</div>

                <!-- Login form (shown when logged out) -->
                <div id="loginForm" class="panel">
                    <h2 class="form-title">Admin Login</h2>
                    <form id="loginFormElement" class="form-stack">
                        <input id="loginEmail" type="email" placeholder="Email" class="form-input" required>
                        <input id="loginPassword" type="password" placeholder="Password" class="form-input" required>
                        <button type="submit" class="btn btn-primary">Login</button>
                    </form>
                </div>

                <!-- Post form container (shown when logged in) -->
                <div id="postFormContainer" class="hidden panel">
                    <h2 class="form-title">Create a Post</h2>
                    <form id="postFormElement" class="form-stack">
                        <select id="postType" class="form-select">
                            <option value="text">Text</option>
                            <option value="project">Project</option>
                        </select>
                        <input id="postTitle" type="text" placeholder="Title" class="form-input" required>
                        <textarea id="postContent" placeholder="Content..." class="form-textarea" rows="4" required></textarea>
                        <input id="postImage" type="file" accept="image/*" class="form-file">
                        <div id="imagePreview" class="hidden image-preview">
                            <img id="previewImg" alt="Preview">
                            <button id="btnRemoveImage" type="button" class="image-preview-remove">Remove image</button>
                        </div>
                        <button id="submitBtn" type="submit" class="btn btn-primary">Publish Post</button>
                    </form>
                    <button id="btnLogout" class="btn-text">Logout</button>
                </div>

                <!-- Navigation helpers -->
                <button id="btnViewPosts" class="btn btn-secondary">View All Posts</button>
                <button id="btnCreatePost" class="btn btn-secondary">New Post</button>

            </main>
            <!-- ===== END MAIN CONTENT ===== -->

        </div>
        <!-- ===== END GRID ===== -->

    </div>
    <!-- ===== END CONTAINER ===== -->

    <!-- ===== CALENDAR SCRIPT ===== -->
    <script>
        function generateCalendar(year, month) {
            const calendarDays = document.getElementById('calendarDays');
            const calendarMonthYear = document.getElementById('calendarMonthYear');
            if (!calendarDays || !calendarMonthYear) return;
            calendarDays.innerHTML = '';

            const monthNames = [
                'January', 'February', 'March', 'April', 'May', 'June',
                'July', 'August', 'September', 'October', 'November', 'December'
            ];
            calendarMonthYear.textContent = `${monthNames[month]} ${year}`;

            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);
            const startDay = firstDay.getDay(); // Sunday=0
            const daysInMonth = lastDay.getDate();

            // Fill empty slots before first day
            for (let i = 0; i < startDay; i++) {
                const emptyCell = document.createElement('div');
                emptyCell.className = 'calendar-day calendar-day--empty';
                calendarDays.appendChild(emptyCell);
            }

            // Fill days
            for (let day = 1; day <= daysInMonth; day++) {
                const dayCell = document.createElement('div');
                dayCell.className = 'calendar-day selectable';
                dayCell.textContent = day;
                dayCell.setAttribute('tabindex', '0');
                dayCell.setAttribute('role', 'button');
                dayCell.setAttribute('aria-label', `Select day ${day} of ${monthNames[month]} ${year}`);
                dayCell.addEventListener('click', () => {
                    alert(`You selected ${monthNames[month]} ${day}, ${year}`);
                });
                dayCell.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        dayCell.click();
                    }
                });
                calendarDays.appendChild(dayCell);
            }
        }

        // Initialize calendar to current month/year
        const today = new Date();
        generateCalendar(today.getFullYear(), today.getMonth());
    </script>

    <!-- ===== SUPABASE CLIENT + BLOG SCRIPT ===== -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="blog.js"></script>

</body>
</html>
