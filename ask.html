<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goober Dev Website</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet" />
    <style>
        /* Custom scrollbar for overflow containers */
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }

        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        /* Light grey text for all text except white UI elements */

            color: #ffffff;
        }

</head>

<body>
    <div class="container">

        <!-- ===== TOP BAR ===== -->
        <div class="top-bar">
            <div>
                ♡ Goobz Creates.exe

                    <a href="index.html" class="bg-white/30 rounded-t-md px-2 py-[2px]">Home</a>
                    <a href="posts.html" class="bg-white/20 rounded-t-md px-2 py-[2px]">Posts</a>
                    <a href="projects.html" class="bg-white/20 rounded-t-md px-2 py-[2px]">Projects</a>
                    <a href="ask.html" class="bg-white/20 rounded-t-md px-2 py-[2px]">Ask/Contact</a>
                </div>
            </div>

            <!-- URL bar with search -->
            <form id="searchForm" class="flex items-center border border-white/50 rounded-md bg-white/30 px-2 py-1 mb-4 text-[10px] font-mono select-text text-white" onsubmit="return false;">
                <div class="flex space-x-1 mr-2">
                    <button type="button" class="w-5 h-5 rounded-full border border-white/50 text-white/50 flex items-center justify-center" aria-label="Back">
                        ◀
                    </button>
                    <button type="button" class="w-5 h-5 rounded-full border border-white/50 text-white/50 flex items-center justify-center" aria-label="Forward">
                        ▶
                    </button>
                    <button type="button" class="w-5 h-5 rounded-full border border-white/50 text-white/50 flex items-center justify-center" aria-label="Reload">
                        ⟳
                    </button>
                </div>
                <div class="flex items-center space-x-1 flex-1 overflow-hidden">
                    <span class="bg-white/50 rounded px-1 text-gray-600 font-semibold">
                        Search
                    </span>
                    <span>
                        :

                    <input aria-label="Search posts" autocomplete="on" class="bg-white/50 rounded px-1 text-gray-600 font-semibold w-full truncate outline-none" id="searchInput" name="search" placeholder="Search posts..." type="search" />
                </div>
                <button aria-label="Clear search" class="ml-2 w-5 h-5 rounded-full border border-white/50 text-white/50 flex items-center justify-center" id="clearSearchBtn" type="button">
                    ✕

            </form>
        </div>
        <!-- ===== END TOP BAR ===== -->
        <!-- ===== MAIN CONTENT AREA WITH GRID ===== -->
        <div class="grid grid-cols-12 gap-4">

            <!-- ===== LEFT SIDEBAR ===== -->
            <aside class="sidebar col-span-3">

                <!-- Profile circle with cherry blossoms -->
                <div class="w-24 h-24 rounded-full overflow-hidden border-2 border-white/70 relative">
                    <img alt="Anime girl with pink cherry blossoms background, circular portrait" class="w-full h-full object-cover" height="96" src="https://storage.googleapis.com/a1aa/image/6d8b772e-8f34-4122-075b-7d3bf8f030a0.jpg" width="96" />
                </div>

                <!-- Bio / Preview -->
                <div class="text-center text-[10px] font-mono select-text text-light-gray">
                    <div>
                        Honey It's You!
                    </div>
                    <div class="bg-white/30 rounded-md mt-1 p-1">
                        <div>
                            Preview: 8 / 8
                        </div>
                        <div>
                            You are viewing Marmalade Suite, the 29th theme released
                        </div>
                    </div>
                    <button class="mt-2 w-full bg-white/30 rounded-md py-1 text-[10px] font-mono text-white">
                        online

                <!-- Clock (needed by JS in linked file) -->
                <div id="clock" class="text-center text-[10px] font-mono text-white mt-2">00:00:00</div>

                <!-- Calendar -->

                        SEPTEMBER 2019
                    </div>
                    <div class="grid grid-cols-7 gap-[1px] text-center">
                        <div class="text-white/50">Su</div>
                        <div class="text-white/50">Mo</div>
                        <div class="text-white/50">Tu</div>
                        <div class="text-white/50">We</div>
                        <div class="text-white/50">Th</div>
                        <div class="text-white/50">Fr</div>
                        <div class="text-white/50">Sa</div>
                    </div>
                    <div class="grid grid-cols-7 gap-[1px] text-center" id="calendarDays">

            </aside>
            <!-- ===== END LEFT SIDEBAR ===== -->
            <!-- ===== MIDDLE / MAIN CONTENT ===== -->
            <main class="main-content col-span-9" id="mainContent">

                <!-- Recent posts widget (populated by linked JS) -->
                <div id="recentPosts"></div>

                <!-- Stats widget -->
                <div class="bg-white/40 rounded-lg p-4 mt-4 text-white font-mono text-sm">
                    <div>Posts: <span id="postCount">0</span></div>
                    <div>Projects: <span id="projectCount">2</span></div>
                </div>

                <!-- Status / login state -->
                <div id="statusText" class="text-white/70 text-xs mt-2">Visitor Mode</div>

                <!-- Login form (shown when logged out) -->
                <div id="loginForm" class="bg-white/40 rounded-lg p-4 mt-4">
                    <h2 class="text-white font-semibold mb-2">Admin Login</h2>
                    <form id="loginFormElement" class="space-y-2">
                        <input id="loginEmail" type="email" placeholder="Email" class="w-full rounded px-2 py-1 text-sm" required>
                        <input id="loginPassword" type="password" placeholder="Password" class="w-full rounded px-2 py-1 text-sm" required>
                        <button type="submit" class="bg-white/30 rounded px-3 py-1 text-white text-sm">Login</button>
                    </form>
                </div>

                <!-- Post form container (shown when logged in) -->
                <div id="postFormContainer" class="hidden bg-white/40 rounded-lg p-4 mt-4">
                    <h2 class="text-white font-semibold mb-2">Create a Post</h2>
                    <form id="postFormElement" class="space-y-2">
                        <select id="postType" class="w-full rounded px-2 py-1 text-sm">
                            <option value="text">Text</option>
                            <option value="project">Project</option>
                        </select>
                        <input id="postTitle" type="text" placeholder="Title" class="w-full rounded px-2 py-1 text-sm" required>
                        <textarea id="postContent" placeholder="Content..." class="w-full rounded px-2 py-1 text-sm" rows="4" required></textarea>
                        <input id="postImage" type="file" accept="image/*" class="text-white text-xs">
                        <div id="imagePreview" class="hidden">
                            <img id="previewImg" alt="Preview" class="max-h-32 rounded mt-2">
                            <button id="btnRemoveImage" type="button" class="text-red-300 text-xs mt-1">Remove image</button>
                        </div>
                        <button id="submitBtn" type="submit" class="bg-white/30 rounded px-3 py-1 text-white text-sm">Publish Post</button>
                    </form>
                    <button id="btnLogout" class="mt-2 text-white/70 text-xs underline">Logout</button>
                </div>

                <!-- Navigation helpers (optional buttons) -->
                <button id="btnViewPosts" class="bg-white/30 rounded px-3 py-1 text-white text-sm mt-4">View All Posts</button>
                <button id="btnCreatePost" class="bg-white/30 rounded px-3 py-1 text-white text-sm mt-4">New Post</button>

            </main>
            <!-- ===== END MAIN CONTENT ===== -->

        </div>
        <!-- ===== END GRID ===== -->

    </div>
    <!-- ===== END CONTAINER ===== -->
    <!-- ===== CALENDAR SCRIPT (moved out of #calendarDays so innerHTML wipe doesn't destroy it) ===== -->
    <script>
        // Calendar generation
        function generateCalendar(year, month) {
            const calendarDays = document.getElementById('calendarDays');
            const calendarMonthYear = document.getElementById('calendarMonthYear');
            if (!calendarDays || !calendarMonthYear) return;
            calendarDays.innerHTML = '';

            const monthNames = [
                'January', 'February', 'March', 'April', 'May', 'June',
                'July', 'August', 'September', 'October', 'November', 'December'
            ];
            calendarMonthYear.textContent = `${monthNames[month]} ${year}`;

            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);
            const startDay = firstDay.getDay(); // Sunday=0
            const daysInMonth = lastDay.getDate();

            // Fill empty slots before first day
            for (let i = 0; i < startDay; i++) {
                const emptyCell = document.createElement('div');
                emptyCell.className = 'text-white/30';
                emptyCell.textContent = '';
                calendarDays.appendChild(emptyCell);
            }

            // Fill days
            for (let day = 1; day <= daysInMonth; day++) {
                const dayCell = document.createElement('div');
                dayCell.className = 'cursor-pointer hover:bg-white/20 rounded select-text';
                dayCell.textContent = day;
                dayCell.setAttribute('tabindex', '0');
                dayCell.setAttribute('role', 'button');
                dayCell.setAttribute('aria-label', `Select day ${day} of ${monthNames[month]} ${year}`);
                dayCell.addEventListener('click', () => {
                    alert(`You selected ${monthNames[month]} ${day}, ${year}`);
                });
                dayCell.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        dayCell.click();
                    }
                });
                calendarDays.appendChild(dayCell);
            }
        }

        // Initialize calendar to current month/year
        const today = new Date();
        generateCalendar(today.getFullYear(), today.getMonth());
    </script>
